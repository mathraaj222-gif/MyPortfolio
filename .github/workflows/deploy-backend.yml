name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'          # Only triggers when backend files change
  workflow_dispatch:           # Allow manual trigger from GitHub Actions UI

jobs:
  deploy:
    name: Build & Deploy to EB
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 4. Generate Prisma client
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # 5. Build TypeScript -> JavaScript
      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      # 6. Create the deployment ZIP
      #    EB uses Dockerfile.prod (renamed to Dockerfile inside ZIP):
      #      - No TypeScript compilation inside Docker (dist/ is pre-built here)
      #      - Only production deps installed (npm ci --omit=dev)
      #      - Faster deploys, smaller image
      - name: Create deployment package
        run: |
          mkdir -p eb-package
          # Use the production Dockerfile (skips TypeScript build inside Docker)
          cp backend/Dockerfile.prod eb-package/Dockerfile
          cp backend/package.json    eb-package/package.json
          cp backend/package-lock.json eb-package/package-lock.json
          cp -r backend/dist          eb-package/dist
          cp -r backend/prisma        eb-package/prisma
          cp -r backend/.ebextensions eb-package/.ebextensions
          cd eb-package
          zip -r ../deploy-backend.zip .
          cd ..
          rm -rf eb-package

      # Verify ZIP uses forward slashes (Linux unzip requirement)
      - name: Verify ZIP path separators
        run: |
          if unzip -l deploy-backend.zip | grep -q '\\'; then
            echo "❌ ZIP contains backslashes — will fail on EB Linux unzip!"
            exit 1
          fi
          echo "✅ ZIP path separators valid (forward slashes only)"
          echo "📦 ZIP contents:"
          unzip -l deploy-backend.zip | head -25


      # 7. Configure AWS credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 8. Sync full repo source snapshot to S3 (audit trail & source-of-truth)
      #    Stored at: s3://<bucket>/source/<sha>/
      - name: Sync source snapshot to S3
        run: |
          aws s3 sync . \
            s3://${{ secrets.EB_S3_BUCKET }}/source/${{ github.sha }}/ \
            --exclude ".git/*" \
            --exclude "node_modules/*" \
            --exclude "backend/node_modules/*" \
            --exclude "frontend/node_modules/*" \
            --exclude "admin/node_modules/*" \
            --delete

      # 9. Upload deployment ZIP to S3
      #    Stored at: s3://<bucket>/deployments/backend-<sha>.zip
      - name: Upload deployment package to S3
        run: |
          VERSION_LABEL="backend-${{ github.sha }}"
          aws s3 cp deploy-backend.zip \
            s3://${{ secrets.EB_S3_BUCKET }}/deployments/${VERSION_LABEL}.zip

      # 10. Create a new EB application version pointing at that S3 object
      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="backend-${{ github.sha }}"
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${{ secrets.EB_S3_BUCKET }}",S3Key="deployments/${VERSION_LABEL}.zip" \
            --auto-create-application

      # 11. Deploy the new version to your EB environment
      - name: Deploy to Elastic Beanstalk environment
        run: |
          VERSION_LABEL="backend-${{ github.sha }}"
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "${VERSION_LABEL}"

      # 12. Wait for deployment to finish
      - name: Wait for environment to be ready
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${{ secrets.EB_ENV_NAME }}"
          echo "✅ Backend deployment complete! Version: backend-${{ github.sha }}"
